<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏资产版本管理工作台</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fff; --line:#e6e9f0; --text:#1c2434; --sub:#667085; --dim:#98a2b3;
  --accent:#6d5efc; --accent-soft:#efeaff; --ok:#12b76a; --ok-soft:#e7f8ef; --warn:#f79009; --danger:#f04438;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --side:228px;
}
body.dark{
  --bg:#12151c; --panel:#1b2030; --line:#2a3142; --text:#eef2f8; --sub:#a8b0c2; --dim:#7d879b;
  --accent:#8b7cff; --accent-soft:#2a2550; --ok:#3dd68c; --ok-soft:#163528; --warn:#f5b14a; --danger:#ff7a72;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px 24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:13px;line-height:1.25;width:156px}
.brand span{color:var(--dim);font-size:11px}
.nav-g{margin:8px 0 4px;padding:0 10px;color:var(--dim);font-size:11px}
.nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;color:var(--sub);display:flex;gap:8px;align-items:center}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav button:hover{background:var(--accent-soft)}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--dim)}
.crumb b{color:var(--text);font-size:14px;display:block;font-weight:650}
.top-actions{display:flex;gap:8px;align-items:center}
.ghost,.pri{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ghost.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.content{padding:18px 22px 40px}
.h1{font-size:22px;margin:2px 0 4px}
.lead{color:var(--sub);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:28px;font-weight:750;letter-spacing:-.03em}
.stat .l{color:var(--sub);font-size:12px}
.stat .s{color:var(--dim);font-size:11px;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.grow{flex:1;min-width:260px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:8px 0 12px}
.tabs button{border:0;background:transparent;padding:8px 0;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:650}
.search{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search input,.search select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.search input{flex:1}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--panel)}
.item.on{border-color:#c9c2ff;background:var(--accent-soft)}
.item h3{margin:0 0 4px;font-size:14px}
.meta{color:var(--dim);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--sub);margin-right:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:#fff6e8;color:#b54708}
.pill.back{background:#fff1f0;color:var(--danger)}
body.dark .pill.wait{background:#3a2d16;color:#f5b14a}
.split{display:grid;grid-template-columns:minmax(200px,260px) minmax(0,1fr);gap:12px;align-items:start}
.split3{display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr) minmax(180px,240px);gap:12px;align-items:start}
.list{max-height:calc(100vh - 150px);overflow:auto;padding-right:2px}
.preview{min-height:220px;border-radius:12px;background:linear-gradient(180deg,#f7f4ff,#eef2ff);display:grid;place-items:center;position:relative;overflow:hidden}
body.dark .preview{background:linear-gradient(180deg,#242038,#1b2030)}
.fig{width:120px;height:180px}
.sprite{max-width:220px;max-height:200px;image-rendering:pixelated;object-fit:contain}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.acard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px;text-align:left;cursor:pointer}
.acard.on{border-color:var(--accent);background:var(--accent-soft)}
.acard img,.acard .ph{width:100%;height:84px;object-fit:contain;background:#1c2434;border-radius:8px;display:grid;place-items:center;color:#fff}
.acard b{display:block;margin-top:6px;font-size:12px;word-break:break-all}
.sprite.run{animation:bob .55s ease-in-out infinite}
.stage{width:260px;height:260px;display:grid;place-items:center;background:radial-gradient(circle at 50% 72%, #3d5270, #1c2434 72%);border-radius:16px}
canvas.woolc{width:220px;height:220px;image-rendering:pixelated}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
@keyframes bob{50%{transform:translateY(-8px)}}
.play{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.bar{height:6px;background:#ddd8f5;border-radius:99px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{animation:load 2.4s linear infinite}
@keyframes load{from{width:0}to{width:100%}}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:6px;margin:12px 0}
.step{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);font-size:12px;color:var(--sub)}
.step.on{background:var(--accent-soft);border-color:#d9d4ff;color:var(--accent);font-weight:650}
.step b{display:block;font-size:11px;margin-bottom:2px}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.gate{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
.gate b{display:block;margin-bottom:4px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12px}
.kv span{color:var(--dim)}
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th,.table td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{color:var(--dim);font-weight:600}
.meter{height:8px;border-radius:99px;background:#d7f5e5;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.miss{background:#f2f4f7}
.miss i{width:0}
.flow{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px}
.node{border:1.5px solid #9db7e8;background:#f4f8ff;border-radius:12px;padding:14px 18px;min-width:280px;text-align:center;font-weight:650}
body.dark .node{background:#1e2a44}
.arrow{width:2px;height:28px;background:#9db7e8;position:relative}
.arrow:after{content:"";position:absolute;left:-4px;bottom:-1px;border:5px solid transparent;border-top-color:#9db7e8}
.toast{position:fixed;right:18px;bottom:18px;background:#1c2434;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.log{position:fixed;right:16px;top:70px;width:340px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 12px 40px rgba(16,24,40,.12);display:none;z-index:12}
.log.show{display:block}
.log li{margin:6px 0;color:var(--sub)}
.sec{margin-top:12px}
.sec h4{margin:0 0 8px}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px}
.prog4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.prog4 div{height:8px;border-radius:99px;background:#e4e7ec}
.prog4 div.done{background:var(--ok)}
.prog4 div.run{background:var(--accent)}
.thumb{height:92px;border-radius:8px;background:
  linear-gradient(160deg,#243044,#6d5efc 70%,#d7c4a1);
  position:relative}
.thumb:after{content:"候选构图 · 人选定后才采用";position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff}
.room{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:12px;align-items:start}
.roster .member{display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px}
.roster .member.on{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--ok)}
.dot.busy{background:var(--warn)}
.thread{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 280px);overflow:auto;padding-right:4px}
.bubble{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.bubble.human{background:#eef3ff}
body.dark .bubble.human{background:#1d2740}
.bubble .who{font-size:12px;color:var(--sub);margin-bottom:4px}
.think{margin-top:8px;padding:8px;border-radius:8px;background:var(--bg);color:var(--sub);font-size:12px}
.artbox{height:168px;border-radius:12px;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 42%,#6f8f62 0 46px,#243044 47px);color:#fff;text-align:center}
.artbox b{display:block;font-size:18px}
.say{display:flex;gap:8px;margin-top:10px}
.say input{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.35);display:grid;place-items:center;z-index:30}
.modal .card{width:min(720px,92vw);max-height:80vh;overflow:auto;padding:16px}
@media(max-width:1100px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;display:flex;flex-wrap:wrap;gap:8px}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .split,.split3,.stats,.room{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">版</div><div><b>游戏资产版本管理工作台</b><span>本地资产 · 提交到仓库</span></div></div>
    <div class="nav" id="nav"></div>
    <p class="note" style="padding:12px 8px">仓库 <a href="https://github.com/nancywu5-hk/AI-game--explore">nancywu5-hk/AI-game--explore</a><br>美术 assets/art<br>音效 assets/audio</p>
  </aside>
  <section class="main">
    <header class="top">
      <div class="crumb"><b id="title">游戏资产版本管理工作台</b><span id="path">assets/art · assets/audio</span></div>
      <div class="top-actions">
        <button class="ghost" id="logBtn">生产日志</button>
        <span class="pill" id="conn">正在连接仓库</span>
        <button class="ghost" id="theme">暗色</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </section>
</div>
<div class="log" id="log"></div>
<div class="toast" id="toast"></div>
<input id="upfile" type="file" hidden>
<script>
const NAV=[
  {g:"管线",items:[
    ["pipes","三条管线"],
    ["role","角色"],
    ["scene","场景"],
    ["ui","界面"]
  ]},
  {g:"协作",items:[
    ["room","联机房间"],
    ["crew","成员与模型"],
    ["board","交接与版本"]
  ]},
  {g:"资产",items:[
    ["library","全部资产"]
  ]},
  {g:"预览",items:[
    ["play","运行游戏"]
  ]},
  {g:"仓库",items:[
    ["commit","提交"]
  ]}
];
const REPO_URL="https://github.com/nancywu5-hk/AI-game--explore";
const GAME={src:"../assets/"};
const FRAMES={"idle":{"file":"idle.png","fps":15,"frames":[[0,0,256,144],[256,0,256,144],[512,0,256,144],[768,0,256,144],[1024,0,256,144],[1280,0,256,144],[1536,0,256,144],[1792,0,256,144],[0,144,256,144],[256,144,256,144],[512,144,256,144],[768,144,256,144],[1024,144,256,144],[1280,144,256,144],[1536,144,256,144],[1792,144,256,144],[0,288,256,144],[256,288,256,144],[512,288,256,144],[768,288,256,144],[1024,288,256,144],[1280,288,256,144],[1536,288,256,144],[1792,288,256,144],[0,432,256,144],[256,432,256,144],[512,432,256,144],[768,432,256,144],[1024,432,256,144]]},"walk":{"file":"walk.png","fps":30,"frames":[[0,0,256,144],[256,0,256,144],[512,0,256,144],[768,0,256,144],[1024,0,256,144],[1280,0,256,144],[1536,0,256,144],[1792,0,256,144],[0,144,256,144],[256,144,256,144],[512,144,256,144],[768,144,256,144],[1024,144,256,144],[1280,144,256,144],[1536,144,256,144],[1792,144,256,144]]},"jump":{"file":"jump.png","fps":30,"frames":[[0,0,256,256],[256,0,256,256],[512,0,256,256],[768,0,256,256],[1024,0,256,256],[1280,0,256,256],[1536,0,256,256],[1792,0,256,256],[0,256,256,256],[256,256,256,256],[512,256,256,256],[768,256,256,256],[1024,256,256,256],[1280,256,256,256],[1536,256,256,256],[1792,256,256,256],[0,512,256,256],[256,512,256,256],[512,512,256,256],[768,512,256,256],[1024,512,256,256],[1280,512,256,256],[1536,512,256,256],[1792,512,256,256],[0,768,256,256]]},"grapple_cw":{"file":"swing.png","fps":25,"frames":[[0,0,256,256],[256,0,256,256],[512,0,256,256],[768,0,256,256],[1024,0,256,256],[1280,0,256,256],[1536,0,256,256],[1792,0,256,256],[0,256,256,256],[256,256,256,256],[512,256,256,256],[768,256,256,256],[1024,256,256,256],[1280,256,256,256],[1536,256,256,256],[1792,256,256,256],[0,512,256,256],[256,512,256,256],[512,512,256,256]]}};
const SKINS=[{id:"wool",name:"原毛",tint:"#ffffff"},{id:"night",name:"夜蓝",tint:"#7eb6ff"},{id:"gold",name:"赤金",tint:"#f0c36a"},{id:"berry",name:"莓红",tint:"#f08aa4"},{id:"moss",name:"森绿",tint:"#7dcea0"}];
const sheetCache={};
function clipOf(name){return name==="swing"?"grapple_cw":(FRAMES[name]?name:"idle")}
function frameImg(clip,index){
  const key=clip+"/"+index;
  if(!sheetCache[key]){
    const im=new Image();
    im.src="wool-frames/"+clip+"/"+index+".png";
    sheetCache[key]=im;
  }
  return sheetCache[key];
}
function currentSkin(){return SKINS.find(s=>s.id===state.skinId)||SKINS[0]}
function paintWool(canvas){
  const name=clipOf(state.dir);
  const spec=FRAMES[name];
  const index=state.woolFrame%spec.frames.length;
  const img=frameImg(name,index);
  const ctx=canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation="source-over";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!img.complete||!img.naturalWidth) return;
  const scale=Math.min(canvas.width/img.naturalWidth, canvas.height/img.naturalHeight);
  const w=img.naturalWidth*scale, h=img.naturalHeight*scale, x=(canvas.width-w)/2, y=(canvas.height-h)/2;
  ctx.drawImage(img, x, y, w, h);
  const tint=currentSkin().tint;
  if(tint!=="#ffffff"){
    ctx.globalCompositeOperation="multiply";
    ctx.fillStyle=tint;
    ctx.fillRect(x,y,w,h);
    ctx.globalCompositeOperation="destination-in";
    ctx.drawImage(img, x, y, w, h);
    ctx.globalCompositeOperation="source-over";
  }
}
let lastTs=0;
function tickWool(ts){
  const dt=lastTs?(ts-lastTs)/1000:0;
  lastTs=ts;
  const spec=FRAMES[clipOf(state.dir)];
  if(state.playing){
    state.acc+=dt*spec.fps;
    if(state.acc>=1){
      state.woolFrame=(state.woolFrame+Math.floor(state.acc))%spec.frames.length;
      state.acc%=1;
      const label=document.getElementById("frameno");
      if(label) label.textContent=(state.woolFrame+1)+" / "+spec.frames.length;
    }
  }
  document.querySelectorAll("canvas.woolc").forEach(paintWool);
  requestAnimationFrame(tickWool);
}
const SPRINTS=[
  {id:"S096",title:"钩爪绳长与 Wool 跳跃不同步",ver:"scripts/features/grappling_feature.gd",st:"待验收",plan:"当前",body:"本卡只改钩爪绳长动画和 Wool 的 jump 循环。不改钉子碰撞，不改排行榜。",checks:["jump 动画不循环，见 wool.gd 的 set_animation_loop","绳长动画速度仍是 800 px/s，改动要写回本卡","未签认前不提交 scenes/levels/level_1.tscn"]},
  {id:"S118",title:"Wool / Eagle / Fish 精灵登记",ver:"assets/character",st:"待验收",plan:"当前",body:"角色流程只认仓库里已有的精灵表，不另造一套帧。",checks:["Wool 有 idle、walk、jump、swing","Eagle 只有 fly.png","Fish 使用 fish.png，不借用 Wool 的表"]},
  {id:"S074",title:"UI 主题与按钮源锁定",ver:"assets/ui/global_theme.tres",st:"已验收",plan:"历史",body:"按钮、暂停、关闭都用 assets/ui 里的源图。主题文件是 res://assets/ui/global_theme.tres。",checks:["project.godot 的 gui/theme/custom 指向 global_theme.tres","button.png、pause-button.png、close-button.png 都在盘点里","换皮不直接改场景里的贴图路径"]},
  {id:"S144",title:"音效键与文件一一对应",ver:"scripts/globals/audio_manager.gd",st:"已验收",plan:"当前",body:"AudioManager 的键必须能找到 wav 或 mp3。缺文件的键不能算已登记。",checks:["wool_hook → assets/sound/wool/hook.wav","enemy_fish_start / enemy_fish_end 成对","背景乐是 assets/sound/game/background.mp3"]}
];
const ROLES=[
  {name:"羊毛人",id:"wool",kind:"操控角色",rev:"scenes/characters/players/wool.tscn",script:"scripts/characters/wool.gd",anims:["idle","walk","jump","swing"],sheet:{idle:"assets/character/wool/idle.png",walk:"assets/character/wool/walk.png",jump:"assets/character/wool/jump.png",swing:"assets/character/wool/swing.png"},sounds:["assets/sound/wool/hook.wav","assets/sound/wool/swing.wav","assets/sound/wool/die.wav"]},
  {name:"鸟",id:"eagle",kind:"空中敌人",rev:"scenes/characters/enemies/eagle.tscn",script:"scripts/characters/eagle.gd",anims:["fly"],sheet:{fly:"assets/character/eagle/fly.png"},sounds:["assets/sound/enemies/bird.wav"]},
  {name:"鱼",id:"fish",kind:"水面敌人",rev:"scenes/characters/enemies/fish.tscn",script:"scripts/characters/fish.gd",anims:["swim"],sheet:{swim:"assets/character/fish/fish.png"},sounds:["assets/sound/enemies/fish-start.wav","assets/sound/enemies/fish-end.wav"]}
];
const SCENES=[
  {name:"背景",id:"assets/map/background.png",tag:"场景",files:["assets/map/background.png"],note:"关卡背景。替换后仍使用这个路径。"},
  {name:"铆钉",id:"assets/map/nails",tag:"机关",files:["assets/map/nails/normal-front.png","assets/map/nails/normal-back.png","assets/map/nails/boost-front.png","assets/map/nails/boost-back.png","assets/map/nails/rusty-front.png","assets/map/nails/rusty-back.png","assets/map/nails/rusty-falloff.png"],note:"普通钉、加速钉、生锈钉。正面、背面分开替换。"}
];
const UIASSETS=[
  {name:"button 按钮",file:"assets/ui/button.png"},
  {name:"pause-button 暂停",file:"assets/ui/pause-button.png"},
  {name:"close-button 关闭",file:"assets/ui/close-button.png"}

async function sendRoom(){
  const text=(state.draft||"").trim();
  if(!text){toast("先写一句，或用 @点名");return}
  if(state.waiting){toast("Agent 正在调用大模型生成思考与回复…");return}
  state.msgs.push({who:"制作人",kind:"human",text});
  state.draft="";

  const whoList=[];
  if(text.includes("@PM")) whoList.push("PM");
  if(text.includes("@美术")) whoList.push("美术");
  if(text.includes("@场景")) whoList.push("场景");
  if(text.includes("@版本")) whoList.push("版本");
  if(text.includes("@记录员")) whoList.push("记录员");
  if(!whoList.length) whoList.push("PM");

  state.waiting=true;
  state.waitingWho=whoList.join("、");
  render();

  try{
    const promises=whoList.map(async who=>{
      const r=await fetch("/api/agent/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({who,text,history:state.msgs.slice(-6),signed:state.signed})
      });
      return await r.json();
    });
    const results=await Promise.all(promises);
    results.forEach(res=>{
      if(!res) return;
      const isArt=res.who==="美术"&&((res.text||"").includes("候选")||(res.text||"").includes("图"));
      state.msgs.push({
        who:res.who,
        kind:"ai",
        model:res.model,
        think:res.think||(res.ok?"深度思考已完成":"大模型调用异常"),
        text:res.text,
        artifact:isArt?"候选图":undefined
      });
      if(res.who==="美术") state.artVer++;
    });
  }catch(err){
    state.msgs.push({who:"系统",kind:"ai",model:"异常",text:"大模型请求未完成："+err.message,think:"请检查本地工作台服务连接"});
  }finally{
    state.waiting=false;
    state.waitingWho="";
    render();
  }
}

      <div class="stat"><div class="n" style="font-size:20px">${state.testStatus||"就绪"}</div><div class="l">健康状态</div><div class="s">点击右上角测试</div></div>

    <div class="card" style="padding:8px 12px"><table class="table"><tr><th>成员</th><th>身份</th><th>绑定的大模型 (可切换)</th><th>API 端点</th><th>唤起方式</th><th>职责边界与设定</th></tr>
      ${CREW.map(c=>{
        if(c.kind!=="Agent") return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.kind)}</td><td>—</td><td>—</td><td>${esc(c.wake)}</td><td>${esc(c.duty)}</td></tr>`;
        const endpoint = (c.model==="hy3"||c.model==="hy4") ? "openapi/v2" : "openapi";
        return `<tr><td><b>${esc(c.name)}</b></td><td><span class="pill ok">${esc(c.kind)}</span></td><td>
          <select data-agent-model="${esc(c.name)}" style="padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg)">
            ${models.map(m=>`<option value="${m}" ${c.model===m?"selected":""}>${m}</option>`).join("")}
          </select>
        </td><td><span class="meta">${endpoint}</span></td><td>${esc(c.wake)}</td><td>${esc(c.duty)}</td></tr>`;
      }).join("")}
    </table></div>
    <p class="note">每个 Agent 拥有独立的思考空间（包含思维链）。在联机房间输入消息时，点名对应 Agent 会实时触发大模型调用；点击「观察思考」可展开模型原生 reasoning_content。</p>`;
}
function viewBoard(){
  const rows=[
    ["assets/art","美术","候选","只出图，不自己入库"],
    ["assets/audio","场景","并行核验","可以和出图同时进行"],
    ["用户签认","制作人",state.signed?"已签认":"待签认","执行者不能自己闭环"],
    ["待推送",(state.repoInfo.pending||[]).length+" 个文件","版本",state.repo],
    ["仓库","版本",state.connected?"已连接":"未连接","nancywu5-hk/AI-game--explore"]
  ];
  return `<h1 class="h1">交接与版本</h1><p class="lead">多人同时看同一批资产。版本只收已签认的差量，再推到仓库。</p>
    <div class="card" style="padding:8px 12px"><table class="table"><tr><th>事项</th><th>负责人</th><th>状态</th><th>备注</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><span class="pill ${r[2]==="待签认"||r[2]==="等待签认"?"wait":"ok"}">${esc(r[2])}</span></td><td class="meta">${esc(r[3])}</td></tr>`).join("")}
    </table></div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><b>独立思考</b><p class="meta">每个 Agent 有自己的过程。房间里看得到结论，也可以打开思考。</p></div>
      <div class="stat"><b>并行生产</b><p class="meta">美术出候选，场景核白模，可以同时进行。</p></div>
      <div class="stat"><b>串行集成</b><p class="meta">签认、入库、提交按闸门来。没过线的候选停在房间里。</p></div>
    </div>`;
}
const views={pipes:viewPipes,library:viewLibrary,art:viewArt,audio:viewAudio,skin:viewSkin,room:viewRoom,crew:viewCrew,board:viewBoard,sprint:viewSprint,role:viewRole,scene:viewScene,ui:viewUI,quest:viewQuest,inv:()=>viewInv(false),invold:()=>viewInv(true),book:viewBook,struct:viewStruct,sum:viewSum,commit:viewCommit,play:viewPlay};
function bind(){
  const v=$("#view");
  v.onclick=e=>{
    const t=e.target;
    if(t.dataset.t){state.tab=t.dataset.t;render()}
    if(t.dataset.r!=null){state.role=+t.dataset.r;if(!ROLES[state.role].anims.includes(state.dir)){state.dir=ROLES[state.role].anims[0];state.woolFrame=0;state.acc=0}render()}
    if(t.dataset.clip){state.dir=t.dataset.clip;state.woolFrame=0;state.acc=0;render()}
    if(t.dataset.skin){state.skinId=t.dataset.skin;render()}
    if(t.id==="applyskin"){applySkin()}
    if(t.dataset.s!=null){state.scene=+t.dataset.s;state.sceneFile=0;render()}
    if(t.dataset.sfile!=null){state.sceneFile=+t.dataset.sfile;render()}
    if(t.dataset.ui!=null){state.uiPick=+t.dataset.ui;render()}
    const go=t.closest&&t.closest("[data-go]");
    if(go){
      state.view=go.dataset.go;
      const idx=go.dataset.idx!=null?+go.dataset.idx:null;
      if(state.view==="role"&&idx!=null){state.role=idx;if(!ROLES[idx].anims.includes(state.dir))state.dir=ROLES[idx].anims[0]}
      if(state.view==="scene"&&idx!=null){state.scene=idx;state.sceneFile=0}
      if(state.view==="ui"&&idx!=null)state.uiPick=idx;
      render();
    }
    if(t.dataset.a!=null){state.audio=+t.dataset.a;state.aud=false;render()}
    if(t.dataset.q!=null){state.quest=+t.dataset.q;render()}
    if(t.dataset.qt){state.qtab=t.dataset.qt;render()}
    if(t.dataset.d!=null){state.dom=+t.dataset.d;render()}
    if(t.dataset.open){toast("打开现行手册："+t.dataset.open);logs.unshift("打开手册 "+t.dataset.open)}
    if(t.id==="play"){state.playing=!state.playing;render()}
    if(t.id==="aud"){state.aud=!state.aud;render()}
    if(t.id==="run"){toast("已生成制作执行单，等待四道闸门");logs.unshift("制作执行单 · "+state.view)}
    if(t.id==="saveq"){toast("源文本已校验，未直接发布");}
    if(t.id==="ref"){toast("已按单一数据源重新盘点")}
    if(t.id==="lockd"){toast("已定位领域与上下游，未改文件")}
    if(t.id==="seediff"){state.diff=!state.diff;render()}
    if(t.id==="refreshc"){loadRepo();toast("提交记录已刷新")}
    if(t.id==="recheck"){state.phase=-1;toast("闸门已重跑");render()}
    const whoBtn=t.closest&&t.closest("[data-who]");
    if(whoBtn){state.focus=whoBtn.dataset.who;render()}
    if(t.id==="think"){state.thinkOn=!state.thinkOn;render()}
    if(t.id==="tocrew"){state.view="crew";render()}
    if(t.id==="send"){sendRoom()}
    if(t.id==="sign"){
      if(state.signed){toast("这张卡已经签认");return}
      state.signed=true;
      state.repo="可以提交";
      state.msgs.push({who:"制作人",kind:"human",text:"本轮签认。版本 Agent 只推 assets 里的美术和音效。"});
      logs.unshift("真人签认 · 版本 Agent 可以提交");
      toast("已签认，版本 Agent 可以提交");
      render();
    }
    if(t.id==="askrepo"){
      if(!state.signed){state.draft="@版本 提交本轮已签认的资产";sendRoom();return}
      state.view="commit";render();loadRepo();
    }
    if(t.dataset.filter){state.libFilter=t.dataset.filter;render()}
    const card=t.closest&&t.closest("[data-lib]");
    if(card){state.libPick=card.dataset.lib;state.aud=false;render()}
    if(t.id==="replacegame"||(t.closest&&t.closest("#replacegame"))){const btn=t.id==="replacegame"?t:t.closest("#replacegame");replaceGame(btn.dataset.target||state.libPick)}
    if(t.dataset.upload){chooseUpload(t.dataset.upload,"")}
    if(t.dataset.replace){chooseUpload(t.dataset.kind,t.dataset.replace)}
    if(t.dataset.file!=null&&t.dataset.kind){
      if(t.dataset.kind==="art")state.pickArt=+t.dataset.file;
      else state.pickAudio=+t.dataset.file;
      state.aud=false;
      render();
    }
    if(t.id==="doCommit"){submitRepo()}
    if(t.id==="runGame"){startGame()}
    if(t.id==="stopGame"){stopGame()}
    if(t.id==="testLLM"){testAllModels()}
  };
  v.onchange=e=>{
    const sel=e.target.closest&&e.target.closest("select[data-agent-model]");
    if(sel){updateAgentModel(sel.dataset.agentModel, sel.value)}
  };
  const sq=$("#sq"); if(sq) sq.oninput=e=>{state.q=e.target.value;render();$("#sq").focus()};
  const sf=$("#sf"); if(sf) sf.onchange=e=>{state.fst=e.target.value;render()};
  const dir=$("#dir"); if(dir) dir.onchange=e=>{state.dir=e.target.value;state.woolFrame=0;state.acc=0;render()};
  const lq=$("#libq"); if(lq) lq.oninput=e=>{state.libQ=e.target.value;render();const n=$("#libq");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  const lf=$("#libfilter"); if(lf) lf.onchange=e=>{state.libFilter=e.target.value;render()};
  const bq=$("#bq"); if(bq) bq.oninput=e=>{state.bookQ=e.target.value;render();$("#bq").focus()};
  const bd=$("#bd"); if(bd) bd.onchange=e=>{state.bookD=e.target.value;render()};
  const say=$("#say");
  if(say){
    say.oninput=e=>{state.draft=e.target.value};
    say.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendRoom()}};
  }
  const th=document.querySelector(".thread");
  if(th) th.scrollTop=th.scrollHeight;
  const clip=document.getElementById("clip");
  if(clip&&state.aud){clip.play().catch(()=>toast("浏览器没有播放这个文件"));}
}
function render(){
  nav();
  $("#view").innerHTML=views[state.view]();
  bind();
  const conn=$("#conn");
  if(conn){conn.textContent=state.connected?"仓库已连接":"未连接仓库";conn.className=state.connected?"pill ok":"pill wait"}
  $("#log").innerHTML="<b>生产日志</b><ul>"+logs.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>";
  $("#log").classList.toggle("show",state.logOn);
}
function chooseUpload(kind,replaceName){
  state.replacePath="";
  state.uploadKind=kind;
  state.replaceName=replaceName||"";
  const input=$("#upfile");
  input.accept=kind==="art"?".png,.jpg,.jpeg,.webp,.gif":".wav,.mp3,.ogg";
  input.click();
}
function replaceGame(path){
  if(!path) return;
  state.replacePath=path;
  state.replaceName="";
  const ext=path.split(".").pop().toLowerCase();
  const input=$("#upfile");
  input.accept="."+ext;
  input.click();
}
async function loadPlay(){
  try{
    const r=await fetch("/api/play");
    const data=await r.json();
    state.playInfo=data;
    state.playInfo.error=data.ok===false?data.error:"";
  }catch(err){
    state.playInfo={running:false,godot:false,error:"工作台服务没有连上"};
  }
  if(state.view==="play") render();
  if((state.playInfo||{}).phase==="importing") setTimeout(loadPlay,3000);
}
async function startGame(){
  try{
    const r=await fetch("/api/play?action=start",{method:"POST"});
    const data=await r.json();
    state.playInfo=data;
    state.playInfo.error=data.ok===false?(data.error||"没有启动"):"";
    toast(data.running?"游戏窗口正在打开":(data.error||"没有启动"));
  }catch(err){
    toast("没有启动游戏");
  }
  render();
  setTimeout(loadPlay,2500);
}
async function stopGame(){
  try{
    const r=await fetch("/api/play?action=stop",{method:"POST"});
    state.playInfo=await r.json();
    toast("已停止游戏");
  }catch(err){
    toast("没有停掉游戏");
  }
  render();
}
async function loadLibrary(){
  try{
    const r=await fetch("/api/library");
    const data=await r.json();
    state.files=data.files||[];
    if(!state.files.some(f=>f.path===state.libPick)) state.libPick=(state.files[0]||{}).path||"";
  }catch(err){
    state.files=[];
  }
  if(state.view==="library") render();
}
async function loadRepo(){
  try{
    const r=await fetch("/api/repo");
    const data=await r.json();
    if(!r.ok||!data.ok) throw new Error(data.error||"连接失败");
    state.repoInfo=data;
    state.connected=true;
    state.commitErr="";
  }catch(err){
    state.connected=false;
    state.commitErr=err.message||"工作台服务没有连上仓库";
  }
  render();
}
async function submitRepo(){
  const msg=(($("#msg")||{}).value||"").trim();
  if(!msg){toast("提交说明不能为空");return}
  state.phase=0;state.commitErr="";state.commitUrl="";render();
  try{
    const r=await fetch("/api/commit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg})});
    const data=await r.json();
    if(!r.ok||!data.ok) throw new Error(data.error||"提交没有完成");
    state.phase=3;
    state.commitUrl=data.url;
    logs.unshift("已推送 "+data.sha.slice(0,7));
    toast("已提交到仓库");
    await loadRepo();
  }catch(err){
    state.phase=-1;
    state.commitErr=err.message;
    toast("提交没有完成");
    render();
  }
}
async function applySkin(){
  const skin=currentSkin();
  try{
    const r=await fetch("/api/skin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:skin.id,name:skin.name,tint:skin.tint})});
    if(!r.ok) throw new Error("http");
    state.skinMsg="已写入 games/Wool-main/resources/skins/active_skin.json，并同步 wool_skin.tres。下次运行 Wool，角色和镐子会染成"+skin.name+"。";
    toast("皮肤已写入 Wool");
    logs.unshift("换皮肤 "+skin.name+" "+skin.tint);
  }catch(err){
    state.skinMsg="预览已换成"+skin.name+"。当前页面没有连上工作台服务，游戏文件还没改。请用 games/Wool-main/tools/workbench_server.py 打开后再点一次。";
    toast("预览已换色，游戏文件未写入");
  }
  render();
}
$("#theme").onclick=()=>{document.body.classList.toggle("dark");$("#theme").textContent=document.body.classList.contains("dark")?"亮色":"暗色"};
$("#logBtn").onclick=()=>{state.logOn=!state.logOn;$("#log").classList.toggle("show",state.logOn)};
$("#upfile").onchange=async e=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file) return;
  const gamePath=state.replacePath;
  const name=state.replaceName||file.name;
  try{
    const r=gamePath
      ? await fetch("/api/replace?path="+encodeURIComponent(gamePath),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:file})
      : await fetch("/api/upload?kind="+encodeURIComponent(state.uploadKind)+"&name="+encodeURIComponent(name),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:file});
    const data=await r.json();
    if(!r.ok||!data.ok) throw new Error(data.error||"上传没有完成");
    state.assetVer=(state.assetVer||0)+1;
    state.replacePath="";
    logs.unshift((gamePath||state.replaceName?"替换 ":"上传 ")+data.file);
    toast("已替换，去提交即可入库");
    if(gamePath) await loadLibrary();
    await loadRepo();
  }catch(err){
    toast(err.message||"上传没有完成");
  }
};
async function loadAgentModels(){
  try{
    const r=await fetch("/api/agent/models");
    const data=await r.json();
    if(data.ok&&data.agents){
      state.agentMeta=data;
      CREW.forEach(c=>{
        if(data.agents[c.name]) c.model=data.agents[c.name].model;
      });
      if(state.view==="crew"||state.view==="room") render();
    }
  }catch(e){}
}
async function updateAgentModel(who, model){
  try{
    const r=await fetch("/api/agent/config",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({who,model})
    });
    const d=await r.json();
    if(d.ok){
      const c=CREW.find(x=>x.name===who);
      if(c) c.model=model;
      toast(`已将 ${who} 切换为 ${model}`);
      logs.unshift(`大模型配置 · ${who} -> ${model}`);
      render();
    }else{
      toast("切换失败："+d.error);
    }
  }catch(err){
    toast("切换失败："+err.message);
  }
}
async function testAllModels(){
  state.testStatus="测试中…";
  render();
  try{
    const r=await fetch("/api/agent/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({who:"PM",text:"测试连通性，请做15字以内的简短答复"})
    });
    const d=await r.json();
    if(d.ok){
      state.testStatus="正常 (通过)";
      toast("大模型 API 连通正常！");
    }else{
      state.testStatus="异常";
      toast("测试失败："+(d.error||"未知"));
    }
  }catch(err){
    state.testStatus="异常";
    toast("连接异常："+err.message);
  }
  render();
}
render();
loadRepo();
loadLibrary();
loadAgentModels();
</script>
</body>
</html>
